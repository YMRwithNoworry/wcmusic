[package]
name = "wcmusic_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
encoding_rs = "0.8.35"
json5 = "0.4.1"
parking_lot = "0.12.5"
regex = "1.11.2"
rquickjs = { version = "0.12.2", features = ["macro"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
ureq = "2.12"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23.0"

[patch.crates-io]
rquickjs-sys = { path = "../vendor/rquickjs-sys" }
