[package]
name = "wcmusic_ui"
version = "0.1.0"
edition = "2024"
description = "WCMusic desktop interface built with GPUI"
license = "MIT"
publish = false

[dependencies]
gpui-kit = "0.6.1"
rfd = "0.15.4"
rodio = "0.20.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12.1"
wcmusic_core = { path = "../wcmusic_core" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
rquickjs-sys = { path = "../vendor/rquickjs-sys" }
