[package]
name = "wcmusic_ui"
version = "1.2.9"
edition = "2024"
description = "WCMusic desktop interface built with GPUI"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
gpui-kit = "0.6.1"
# 封面缩略图：落盘前把平台给的巨图缩到显示尺寸，避免 GPUI 解码后常驻几十 MB/张。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
regex = "1.11"
rfd = "0.15.4"
rodio = "0.20.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12.1"
wcmusic_core = { path = "../wcmusic_core" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 仅用于在 build.rs 中把应用图标（ICO，资源 ID 1）编译进 Windows 可执行文件。
embed-resource = "3"

[patch.crates-io]
rquickjs-sys = { path = "../vendor/rquickjs-sys" }
