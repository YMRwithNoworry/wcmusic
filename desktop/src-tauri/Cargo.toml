[package]
name = "wcmusic-desktop"
version = "1.2.43"
edition = "2024"
description = "WCMusic 桌面端（Tauri 2 + React）"
license = "MIT"
publish = false

[lib]
name = "wcmusic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必须带上这个 feature：Tauri 用 `dev = !custom_protocol` 决定加载
# 「开发服务器 URL」还是「内嵌的前端资源」。不带它时，即使是 --release 构建，
# 程序也会去连 http://localhost:1420，表现为启动后提示「无法连接到 localhost」。
# `npm run tauri dev` 不要带它（dev 模式要走 vite 的开发服务器）。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# 托盘用内置的 tray-icon；图标解码要 image-png / image-ico。
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 曲库索引、SQLite、音源 QuickJS 运行时、洛雪备份/M3U 解析都复用共享核心。
wcmusic_core = { path = "../../native/wcmusic_core" }
# 播放：rodio 出声，fundsp 做空间音频。
rodio = "0.20.1"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
# 封面缩略图：落盘前把平台给的巨图缩到显示尺寸。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# 网络：歌词、更新检查、音频/封面下载。
ureq = "2.12.1"
base64 = "0.22"
regex = "1.11"
# 导入音源时的文件选择：由前端的 `<input type="file">` 负责，
# 不引入 rfd / tauri-plugin-dialog——它们在这个 Tauri 进程里创建不出对话框。

# 全局快捷键用 Win32 的 RegisterHotKey + 消息窗口。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
rquickjs-sys = { path = "../../native/vendor/rquickjs-sys" }
