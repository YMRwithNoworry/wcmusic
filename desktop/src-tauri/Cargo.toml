[package]
name = "wcmusic-desktop"
version = "1.2.100"
edition = "2024"
description = "WCMusic 桌面端（GPUI Kit）"
license = "MIT"
publish = false

[lib]
name = "wcmusic_desktop_lib"

[dependencies]
gpui-kit = "=0.11.0"
base64 = "0.22"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 曲库索引、SQLite、音源 QuickJS 运行时、洛雪备份/M3U 解析都复用共享核心。
wcmusic_core = { path = "../../native/wcmusic_core" }
# 播放：rodio 出声，fundsp 做空间音频。
rodio = "0.20.1"
fundsp = { version = "0.23", default-features = false, features = ["std"] }
# 封面缩略图：落盘前把平台给的巨图缩到显示尺寸。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# 网络：歌词、更新检查、音频/封面下载。
ureq = "2.12.1"
regex = "1.11"

# 全局快捷键用 Win32 的 RegisterHotKey + 消息窗口。
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
rquickjs-sys = { path = "../../native/vendor/rquickjs-sys" }
