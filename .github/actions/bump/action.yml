name: 递增版本并锁定构建提交
description: 查询最新 vX.Y.Z 发布、递增版本（Windows 与 Android 共用同一版本号）、写回 pubspec 并提交。

inputs:
  tag-prefix:
    description: 发布 tag 前缀（合并发布固定为 v）
    required: false
    default: v
  bump:
    description: patch / minor / major / none
    required: false
    default: patch

outputs:
  version:
    value: ${{ steps.source.outputs.version }}
  previous:
    value: ${{ steps.source.outputs.previous }}
  tag:
    value: ${{ steps.source.outputs.tag }}
  sha:
    value: ${{ steps.source.outputs.sha }}
  build:
    value: ${{ steps.source.outputs.build }}

runs:
  using: composite
  steps:
    - id: latest
      name: 查询最新发布版本
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        # 不用 releases/latest：历史上有 android-v 标签混在其中。
        # gh 的 --jq 不认 jq 的 --arg，所以先列出标签再在 shell 里按前缀挑最新。
        tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
        tag=$(printf '%s\n' "$tags" | sed -n "s/^${TAG_PREFIX}\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p" | sort -V | tail -1)
        if [ -n "$tag" ]; then tag="${TAG_PREFIX}${tag}"; fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - id: bump
      name: 递增版本（patch / minor / major / none）
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        BUMP: ${{ inputs.bump }}
        LATEST: ${{ steps.latest.outputs.tag }}
      run: node scripts/release/bump-version.mjs --tag-prefix "$TAG_PREFIX" "$BUMP" "$LATEST"
    - id: source
      name: 写回版本并锁定构建提交
      shell: bash
      env:
        TAG: ${{ steps.bump.outputs.tag }}
        BUILD: ${{ steps.bump.outputs.build }}
        PREVIOUS: ${{ steps.bump.outputs.previous }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        version=$(grep -E '^version: [0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -1 | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        files="pubspec.yaml pubspec.lock"
        tag=""
        if [ "$BUILD" = "true" ]; then
          # 并发写回时先同步远端（机器人新提交 [skip ci]，不会触发新构建）
          # 只更新远端跟踪分支：git fetch origin <branch> 还会写 FETCH_HEAD，
          # 之后 rebase 会提示工作区有未暂存改动。
          git fetch --quiet --no-tags origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase --quiet --autostash "origin/$GITHUB_REF_NAME"
          tag=$TAG
        fi
        if [ -n "$tag" ] && ! git diff --quiet -- $files; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "chore(release): $tag [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
          version=$(grep -E '^version: [0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -1 | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        fi
        compute=$(git rev-parse HEAD)
        {
          echo "version=$version"
          echo "previous=$PREVIOUS"
          echo "tag=${TAG_PREFIX}$version"
          echo "sha=$compute"
          echo "build=$BUILD"
        } >> "$GITHUB_OUTPUT"
