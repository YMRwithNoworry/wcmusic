name: Release

# 普通分支推送自动发布；机器人写回版本/官网的提交不重复触发构建。
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号递增方式（none 重新发布当前版本）
        type: choice
        options: [patch, minor, major, none]
        default: patch
        required: false

permissions:
  contents: write

# 所有分支共用发布序列，避免争抢版本号或覆盖正在构建的 Release。
concurrency:
  group: wcmusic-release
  cancel-in-progress: false

jobs:
  version:
    name: 确定版本与构建提交
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验发布脚本
        run: node --test scripts/release/release.test.mjs
      - id: latest
        name: 查询最新已发布版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: bump
        name: 递增版本（不低于已发布版本）
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          LATEST: ${{ steps.latest.outputs.tag }}
        run: node scripts/release/bump-version.mjs "$BUMP" "$LATEST"
      - id: source
        name: 写回版本并锁定构建提交
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/Cargo.toml desktop/src-tauri/Cargo.lock desktop/package.json desktop/package-lock.json pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: 构建 Windows 包
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # 桌面端 UI 已换成 Flutter + Forui，发布产物是 Flutter Windows 包。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - run: flutter pub get
      - name: 静态分析与测试
        run: |
          flutter analyze
          flutter test
      - name: 构建 Flutter 桌面端
        run: flutter build windows --release
      - name: 打包 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* dist\
          Compress-Archive -Path dist\* -DestinationPath dist\wcmusic-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/wcmusic-windows-x64.zip
          if-no-files-found: error

  # Android 构建失败时仍发布 Windows；官网沿用上个实际存在的 APK。
  android:
    name: 构建 Android 包
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: 收集 APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/wcmusic-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/wcmusic-android-arm64.apk
          if-no-files-found: error

  release:
    name: 发布 Release 并同步官网源码
    needs: [version, windows, android]
    if: ${{ always() && needs.version.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        continue-on-error: true
        with:
          name: android
          path: dist
      - name: 检查资产
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -s dist/wcmusic-windows-x64.zip
          if [ -s dist/wcmusic-android-arm64.apk ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "android_url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/wcmusic-android-arm64.apk" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            url=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false) | .assets[] | select(.name == "wcmusic-android-arm64.apk")][0].browser_download_url // ""')
            test -n "$url" || { echo "::error::未找到可用的历史 APK"; exit 1; }
            echo "android_url=$url" >> "$GITHUB_OUTPUT"
            echo "::warning::Android 未出包，官网保留历史 APK：$url"
          fi
      - name: 生成 Release 说明与官网改动
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          ANDROID: ${{ steps.assets.outputs.android }}
          ANDROID_URL: ${{ steps.assets.outputs.android_url }}
        run: |
          node scripts/release/sync-site.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" --previous "v$PREVIOUS" --android "$ANDROID" --android-url "$ANDROID_URL" --notes release-notes.md
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          assets=(dist/wcmusic-windows-x64.zip)
          if [ -s dist/wcmusic-android-arm64.apk ]; then assets+=(dist/wcmusic-android-arm64.apk); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "WCMusic $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "WCMusic $VERSION" --notes-file release-notes.md --latest "${assets[@]}"
          fi
      - name: 写回官网源码
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/app.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): 同步 ${{ needs.version.outputs.tag }} [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site/
          if-no-files-found: error

  deploy:
    name: 部署 Cloudflare Pages 官网
    needs: [version, release]
    if: ${{ always() && needs.version.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wcmusic.pages.dev
    steps:
      - name: 检查部署凭据
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::请在仓库 Actions Secrets 中设置 CLOUDFLARE_API_TOKEN（账号 Cloudflare Pages Edit 权限）"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::请设置仓库变量 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 部署正式站点
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
        run: npx --yes wrangler@4.59.2 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=true
      - name: 验证正式站点版本
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "https://wcmusic.pages.dev/?release=$VERSION" | grep -Fq "Windows $VERSION"; then
              echo "官网已同步 Windows $VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::正式站点未显示本次版本 $VERSION"
          exit 1
