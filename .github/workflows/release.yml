name: Release

# 普通分支推送自动发布；机器人写回版本/官网的提交不重复触发构建。
#
# Windows 与 Android 合并发布：两端共用同一个版本号，同一个 vX.Y.Z Release 里
# 同时挂 Windows 的 zip 与 Android 的 apk。任一端构建失败就不会发版，避免出现
# 只有半个产物的 Release。
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      bump:
        description: 版本号递增方式（none 重新发布当前版本）
        type: choice
        options: [patch, minor, major, none]
        default: patch
        required: false

permissions:
  contents: write

# 所有分支共用发布序列，避免争抢版本号或覆盖正在构建的 Release。
concurrency:
  group: wcmusic-release
  cancel-in-progress: false

jobs:
  # 先跑一遍轻量的跨平台检查，失败就完全不发版，避免把坏版本推出去。
  checks:
    name: 静态分析、测试与发布脚本校验
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # checkout v4 默认不把 token 写进 remote，机器人提交需要显式带上凭据。
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验发布脚本
        run: node --test scripts/release/release.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 静态分析与测试
        id: check
        run: |
          flutter analyze
          flutter test
      # golden 在 Windows / Linux 上解析字体度量略有差异，失败时保留差异图便于排查。
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  # 合并发布只有一个版本任务：递增一次版本，Android 构建号也在同一次提交里 +1。
  version:
    name: 确定发布版本与构建提交
    needs: checks
    if: ${{ always() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # checkout v4 默认不把 token 写进 remote，机器人提交需要显式带上凭据。
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/bump
        id: bump
        with:
          tag-prefix: v
          bump: ${{ inputs.bump || 'patch' }}

  # 两端并行构建，产物都交给最后的 publish 合成一个 Release。
  windows:
    name: 构建 Windows 包
    needs: version
    # check 阶段已经跑过 analysis + test，这里专注出包。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      # 桌面端 UI 已换成 Flutter + Forui，发布产物是 Flutter Windows 包。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - run: flutter pub get
      - name: 构建 Flutter 桌面端
        # 版本任务写回的是递增后的 pubspec 版本，这里显式传入，保证 exe 的版本
        # 资源与实际发布的 tag 一致（应用靠它判断“有没有更新”）。
        run: flutter build windows --release --build-name=${{ needs.version.outputs.version }}
      - name: 打包 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* dist\
          Compress-Archive -Path dist\* -DestinationPath dist\wcmusic-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/wcmusic-windows-x64.zip
          if-no-files-found: error

  android:
    name: 构建 Android 包
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: 收集 APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/wcmusic-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/wcmusic-android-arm64.apk
          if-no-files-found: error

  # 两端都出包后才发布：一个 Release，两个产物，说明里同时列出两种下载。
  publish:
    name: 发布合并 Release
    needs: [version, windows, android]
    if: ${{ always() && needs.version.result == 'success' && needs.windows.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,android}"
          merge-multiple: true
          path: dist
      - name: 检查资产
        run: |
          test -s dist/wcmusic-windows-x64.zip
          test -s dist/wcmusic-android-arm64.apk
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          node scripts/release/sync-site.mjs --version "$VERSION" \
            --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          assets="dist/wcmusic-windows-x64.zip dist/wcmusic-android-arm64.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
            gh release edit "$TAG" --title "WCMusic $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "WCMusic $VERSION" \
              --notes-file release-notes.md --latest $assets
          fi

  site:
    name: 同步官网源码
    needs: [version, publish]
    if: ${{ always() && needs.version.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成官网改动
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          node scripts/release/sync-site.mjs --platform site \
            --version "$VERSION" --previous "$PREVIOUS" \
            --repo "$GITHUB_REPOSITORY"
      - name: 写回官网源码
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/app.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): 同步 ${VERSION} [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site/
          if-no-files-found: error

  deploy:
    name: 部署 Cloudflare Pages 官网
    needs: [version, site]
    if: ${{ always() && needs.version.result == 'success' && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wcmusic.pages.dev
    steps:
      - name: 检查部署凭据
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::请在仓库 Actions Secrets 中设置 CLOUDFLARE_API_TOKEN（账号 Cloudflare Pages Edit 权限）"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::请设置仓库变量 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 部署正式站点
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 账号 ID 与项目名是仓库级 variables，不是 secrets；写错来源会让
          # wrangler 拿不到账号，报成含糊的 “Authentication error”。
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::缺少仓库变量 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4.59.2 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=true
      - name: 验证正式站点版本
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            page=$(curl --fail --silent --show-error "https://wcmusic.pages.dev/?release=$VERSION") || page=""
            if echo "$page" | grep -Fq "Windows $VERSION · Android $VERSION"; then
              echo "官网已同步 $VERSION（Windows + Android）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::正式站点未显示本次版本 $VERSION"
          exit 1
