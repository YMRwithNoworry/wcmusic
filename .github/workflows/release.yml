name: Release

# 普通分支推送自动发布；机器人写回版本/官网的提交不重复触发构建。
#
# Windows 与 Android 各自独立发版、独立递增版本号：
# - Windows 发 vX.Y.Z（只含 wcmusic-windows-x64.zip）
# - Android 发 android-vX.Y.Z（只含 wcmusic-android-arm64.apk）
# 两端的构建互不阻塞：一端失败不会影响另一端出包。
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      target:
        description: 要发布的平台
        type: choice
        options: [both, windows, android]
        default: both
        required: true
      bump:
        description: 版本号递增方式（none 重新发布当前版本）
        type: choice
        options: [patch, minor, major, none]
        default: patch
        required: false

permissions:
  contents: write

# 所有分支共用发布序列，避免争抢版本号或覆盖正在构建的 Release。
concurrency:
  group: wcmusic-release
  cancel-in-progress: false

jobs:
  # 先跑一遍轻量的跨平台检查，失败就完全不发版，避免把坏版本推出去。
  checks:
    name: 静态分析、测试与发布脚本校验
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # checkout v4 默认不把 token 写进 remote，机器人提交需要显式带上凭据。
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验发布脚本
        run: node --test scripts/release/release.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 静态分析与测试
        id: check
        run: |
          flutter analyze
          flutter test
      # golden 在 Windows / Linux 上解析字体度量略有差异，失败时保留差异图便于排查。
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: golden-failures
          path: test/failures/
          if-no-files-found: ignore

  # 版本任务拆成两个独立 job：两条线顺序执行（共用 concurrency 组），
  # 后执行的一条能看到前一条刚写的版本提交，各自用自己前缀的 tag 递增版本。
  # 合并在一个 matrix job 里时，两端会同时 push，先推送的一方会撞上另一方的未提交改动。
  version-windows:
    name: 确定 Windows 版本与构建提交
    needs: checks
    concurrency:
      group: wcmusic-version-${{ github.ref_name }}
      cancel-in-progress: false
    if: ${{ always() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.bump_version }}
      previous: ${{ steps.bump.outputs.bump_previous }}
      tag: ${{ steps.bump.outputs.bump_tag }}
      sha: ${{ steps.bump.outputs.bump_sha }}
      build: ${{ steps.bump.outputs.bump_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # checkout v4 默认不把 token 写进 remote，机器人提交需要显式带上凭据。
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/bump
        with:
          platform: windows
          tag-prefix: v
          target: ${{ inputs.target || 'both' }}
          bump: ${{ inputs.bump || 'patch' }}

  version-android:
    name: 确定 Android 版本与构建提交
    needs: checks
    concurrency:
      group: wcmusic-version-${{ github.ref_name }}
      cancel-in-progress: false
    if: ${{ always() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.bump_version }}
      previous: ${{ steps.bump.outputs.bump_previous }}
      tag: ${{ steps.bump.outputs.bump_tag }}
      sha: ${{ steps.bump.outputs.bump_sha }}
      build: ${{ steps.bump.outputs.bump_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # checkout v4 默认不把 token 写进 remote，机器人提交需要显式带上凭据。
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/bump
        with:
          platform: android
          tag-prefix: android-v
          target: ${{ inputs.target || 'both' }}
          bump: ${{ inputs.bump || 'patch' }}

  windows:
    name: 构建 Windows 包
    needs: version-windows
    if: ${{ needs.version-windows.outputs.build == 'true' }}
    # check 阶段已经跑过 analysis + test，这里专注出包。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-windows.outputs.sha }}
      # 桌面端 UI 已换成 Flutter + Forui，发布产物是 Flutter Windows 包。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - run: flutter pub get
      - name: 构建 Flutter 桌面端
        run: flutter build windows --release
      - name: 打包 ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* dist\
          Compress-Archive -Path dist\* -DestinationPath dist\wcmusic-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/wcmusic-windows-x64.zip
          if-no-files-found: error

  android:
    name: 构建 Android 包
    needs: version-android
    if: ${{ needs.version-android.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-android.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/wcmusic_core
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: 收集 APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/wcmusic-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/wcmusic-android-arm64.apk
          if-no-files-found: error

  # 两端各自发布，互不等待：Windows 失败不影响 Android 出包，反之亦然。
  # 用两个独立 job 引用 needs 输出，因为 matrix 里不能直接引用 needs（YAML 会当成空值）。
  publish-windows:
    name: 发布 Windows Release
    needs: [version-windows, windows]
    if: ${{ always() && needs.version-windows.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-windows.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: 检查资产
        run: test -s dist/wcmusic-windows-x64.zip
      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.version-windows.outputs.version }}
          PREVIOUS: ${{ needs.version-windows.outputs.previous }}
        run: |
          node scripts/release/generate-notes.mjs --platform windows --version "$VERSION" \
            --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version-windows.outputs.tag }}
          VERSION: ${{ needs.version-windows.outputs.version }}
          SOURCE_SHA: ${{ needs.version-windows.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wcmusic-windows-x64.zip --clobber
            gh release edit "$TAG" --title "WCMusic $VERSION" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "WCMusic $VERSION" \
              --notes-file release-notes.md --latest dist/wcmusic-windows-x64.zip
          fi

  publish-android:
    name: 发布 Android Release
    needs: [version-android, android]
    if: ${{ always() && needs.version-android.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-android.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist
      - name: 检查资产
        run: test -s dist/wcmusic-android-arm64.apk
      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.version-android.outputs.version }}
          PREVIOUS: ${{ needs.version-android.outputs.previous }}
        run: |
          node scripts/release/generate-notes.mjs --platform android --version "$VERSION" \
            --previous "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version-android.outputs.tag }}
          VERSION: ${{ needs.version-android.outputs.version }}
          SOURCE_SHA: ${{ needs.version-android.outputs.sha }}
        run: |
          set -euo pipefail
          title="WCMusic $VERSION（Android）"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wcmusic-android-arm64.apk --clobber
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --target "$SOURCE_SHA" --title "$title" \
              --notes-file release-notes.md dist/wcmusic-android-arm64.apk
          fi

  # 官网只有在上一次同步之后「两条线都出了新版本」才重写一次，避免只更新一半链接。
  site:
    name: 同步官网源码
    needs: [version-windows, version-android, publish-windows, publish-android]
    if: ${{ always() && needs.version-windows.result == 'success' && needs.version-android.result == 'success' && needs.publish-windows.result == 'success' && needs.publish-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-windows.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 生成官网改动
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_VERSION: ${{ needs.version-windows.outputs.version }}
          WINDOWS_PREVIOUS: ${{ needs.version-windows.outputs.previous }}
          ANDROID_VERSION: ${{ needs.version-android.outputs.version }}
          ANDROID_PREVIOUS: ${{ needs.version-android.outputs.previous }}
        run: |
          set -euo pipefail
          node scripts/release/sync-site.mjs --platform site \
            --windows-version "$WINDOWS_VERSION" --windows-previous "$WINDOWS_PREVIOUS" \
            --android-version "$ANDROID_VERSION" --android-previous "$ANDROID_PREVIOUS" \
            --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: 写回官网源码
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/app.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(site): 同步 Windows ${{ needs.version-windows.outputs.version }} / Android ${{ needs.version-android.outputs.version }} [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: site/
          if-no-files-found: error

  deploy:
    name: 部署 Cloudflare Pages 官网
    needs: [version-windows, site]
    if: ${{ always() && needs.version-windows.result == 'success' && needs.site.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wcmusic.pages.dev
    steps:
      - name: 检查部署凭据
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::请在仓库 Actions Secrets 中设置 CLOUDFLARE_API_TOKEN（账号 Cloudflare Pages Edit 权限）"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::请设置仓库变量 CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 部署正式站点
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          SOURCE_SHA: ${{ needs.version-windows.outputs.sha }}
        run: npx --yes wrangler@4.59.2 pages deploy site --project-name "$CF_PROJECT" --branch main --commit-hash "$SOURCE_SHA" --commit-dirty=true
      - name: 验证正式站点版本
        env:
          WINDOWS_VERSION: ${{ needs.version-windows.outputs.version }}
          ANDROID_VERSION: ${{ needs.version-android.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            page=$(curl --fail --silent --show-error "https://wcmusic.pages.dev/?release=$WINDOWS_VERSION-$ANDROID_VERSION") || page=""
            if echo "$page" | grep -Fq "Windows $WINDOWS_VERSION · Android $ANDROID_VERSION"; then
              echo "官网已同步 Windows $WINDOWS_VERSION / Android $ANDROID_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::正式站点未显示本次版本（Windows $WINDOWS_VERSION / Android $ANDROID_VERSION）"
          exit 1
